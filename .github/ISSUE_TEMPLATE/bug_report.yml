name: Bug report
description: Something does not work as expected in Tsuyu.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Do not include personal data: no IP addresses, serial numbers, account names, server URLs or tokens. Security issues go through the private advisory form, and questions go to GitHub Discussions.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this bug is not already reported.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: Tsuyu version
      description: Shown in the app, or the name of the release you installed.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Brand and Android version only.
      placeholder: Google TV, Android 14
    validations:
      required: true
  - type: input
    id: client-app
    attributes:
      label: App using Tsuyu
      description: The app that uses the Shizuku API through Tsuyu, if the bug involves one, with its version.
      placeholder: Example App 2.3.1
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tsuyu
        2. Select ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional logcat excerpt. Remove anything personal before pasting.
      render: shell
    validations:
      required: false
