schema: spec-driven

context: |
  Language: en
  All artifacts must be written in English. The app's UI strings use localized Android resources in English, French, German, Spanish and Italian.

  Tsuyu: privileged access service for Android TV / Google TV, compatible with the Shizuku API, fully usable with the remote.
  It starts a server with shell rights on the TV itself (local adb, the app's own RSA key, "Always allow" once), restarts it after every reboot
  and delivers the Shizuku binder to client apps. Clean rewrite inspired by Shizuku and Shevery, not a fork.
  Priorities: 1) reliable start and restart, with no computer and no phone; 2) strict compatibility with existing Shizuku-API clients;
  3) a flow people understand with the remote (DESIGN.md); 4) security: no access without the user's explicit consent.

  Stack: Kotlin, Jetpack Compose for TV, StateFlow, DataStore. Namespace fr.sygix.tsuyu, minSdk 34, compileSdk 37. UI follows system languages by default, with English as fallback and a manual language selector on Home.
  Architecture: SOLID/KISS/DRY, interfaces at the boundaries (adb connection, server, system settings), no logic in composables. Uniflow ViewModel -> StateFlow -> Compose.

  Verified device facts and the Shizuku compatibility contract: AGENTS.md ("Verified facts" and "Shizuku API compatibility"). Licenses and Shizuku restrictions: AGENTS.md, Licenses.
  Roadmap: P0 foundation (delivered), P1 local start, P2 Shizuku API compatibility, P3 persistence, P4 distribution. Undecided topics: openspec/backlog.md.

  Treat the repository as public: no secret and no local environment detail (absolute paths, IPs, device ports, user, machine or VM names, exact device model) in documents, commits and PRs.

rules:
  proposal:
    - "List the capabilities touched and the changes this one depends on."
    - "If an assumption changes along the way, rework every document of the change and the PR description: no trace of the old assumption may remain."
    - "A Non-goals section is mandatory: what is deferred, and to which phase."
    - "Any product choice Sygix has not decided goes into an \"Open questions\" section and appears nowhere else as a decision (not as a SHALL, not in design or tasks) until it is approved."
  specs:
    - "Every requirement that depends on the system (adb, settings, app-ops, other apps) covers these scenarios: success, user refusal, feature missing on the device, timeout, state after a TV reboot."
    - "Every focusable UI specifies D-pad navigation: initial focus, moves at the edges (no wrap-around unless stated), the Back key, focus restoration when returning from a sub-screen or another app, and the case where the focused element has disappeared."
    - "Every requirement touching the Shizuku API names the expected behavior on the Shizuku-API client side (method called, observed result) so a test with a real client can verify it."
    - "Never rely on a device behavior that is not in the verified facts of AGENTS.md; otherwise mark it as an assumption and plan a verification task on the TV."
    - "No contradiction with another spec or open change: one capability describes a behavior, the others refer to it."
    - "If an existing requirement changes, write a MODIFIED delta on that requirement, never a parallel ADDED one that would contradict it after archiving."
    - "Strict format: '### Requirement:' with SHALL/MUST, '#### Scenario:' with separate '- **WHEN**' / '- **THEN**' bullets, never on a single line."
  design:
    - "For every element taken from Shizuku or Shevery: origin file, what is kept, what is removed and why, license of the header."
    - "Prefer the simplest solution that covers the spec; no option, persisted preference or layer without an expressed need."
    - "Minimal privileged surface: what the server exposes and with which rights, and how an unauthorized app is kept out."
    - "Errors: never swallowed; an operation returns a Result (or equivalent) so the UI can tell each cause apart and offer the next action. Bounded timeout on every connection and system call."
  tasks:
    - "If a device behavior is not verified, the first task is a test on the TV, before any code."
    - "Include tests: JUnit for pure logic (adb protocol, states, permissions), Compose D-pad navigation tests with @Config(qualifiers = \"w960dp-h540dp-xhdpi\"), and for P2 a test with the Shizuku-API demo app on the TV."
    - "Include: French strings in resources, testTags, license headers and NOTICE when code is taken, README update if visible behavior changes, validation on the real TV with assembleRelease, openspec archive."
    - "No machine-specific path, variable or configuration: only ./gradlew <task>."
    - "Every task has a verifiable done criterion; no \"study\" or \"consider\" task: decide it in design or put it in Open questions."

operations:
  apply:
    guidance:
      - "No comments in code or tests, except each file's license header; check the diff before committing."
      - "Only tick a task after checking it in the code and with a test that would fail without the change."
      - "Code taken from Shizuku or Shevery: only what the spec requires, rewritten to the repo conventions, with the provenance header from AGENTS.md."
      - "Every test holds an assertion that would fail without the tested behavior; no Thread.sleep, await a state (first { … } under withTimeout, runTest)."
      - "Add nothing that is neither in the spec nor requested (an idea goes as a suggestion in the PR)."
      - "Review replies: address every point without exception, each with a status (handled / partial / not handled / handled differently) and a proof (file:line, test name)."
      - "Before opening or updating the PR: run openspec-verify-change on the change and ./gradlew test."
  archive:
    guidance:
      - "Archive only after the merge on main and validation on the real TV."
      - "Check that openspec validate --all --strict passes after the deltas are merged."
